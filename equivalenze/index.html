<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Macro Studio · Equivalenze</title><link rel="stylesheet" href="../style.css"></head><body><header><a class="brand" href="../index.html">Macro Studio</a><h1>Equivalenze alimentari</h1></header><main>
<section class="panel"><p>Le voci crude e cotte restano distinte. Una equivalenza per un nutriente non garantisce equivalenza negli altri.</p><label>Alimento originale<select id="fromFood"></select></label><label>Grammi<input id="grams" type="number" min="0.1" max="10000" step="any" value="80"></label><label>Alimento sostitutivo<select id="toFood"></select></label><label>Nutriente<select id="criterion"><option value="kcal">Calorie</option><option value="carbs">Carboidrati</option><option value="protein">Proteine</option><option value="fat">Grassi</option></select></label><p id="fromSource"></p><p id="toSource"></p><div id="resultContent" aria-live="polite"></div><button id="save" disabled>Esporta risultato JSON</button><p id="resultMessage" role="status"></p></section>
<section class="panel"><h2>Modifica alimento originale selezionato</h2><form id="customForm"><label>Nome<input id="customName" required></label><label>Categoria<input id="customCategory" value="Personalizzati"></label><label>Calorie<input id="customKcal" type="number" min="0" max="900" step="any"></label><label>Carboidrati<input id="customCarbs" type="number" min="0" max="100" step="any"></label><label>Proteine<input id="customProtein" type="number" min="0" max="100" step="any"></label><label>Grassi<input id="customFat" type="number" min="0" max="100" step="any"></label><label>Fibra<input id="customFiber" type="number" min="0" max="100" step="any"></label><label>Fonte<input id="customSource" required></label><p>Lascia vuoti i valori sconosciuti.</p><button>Salva alimento</button><p id="customMessage" role="status"></p></form><label>Cerca personalizzati<input id="customSearch" type="search"></label><p id="dbCount"></p><table><tbody id="dbBody"></tbody></table></section></main>
<script src="../nutrition-display.js"></script><script src="../nutrition.js"></script><script src="../food-catalog-data.js"></script><script src="../food-catalog.js"></script><script src="../equivalences.js"></script><script src="../equivalence-catalog.js"></script><script src="../equivalences-ui.js"></script><script src="app.js"></script></body></html>
